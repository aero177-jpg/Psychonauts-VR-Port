; psyvr.ini -- settings of the Psychonauts VR mod, each shown with
; its default and what it does. The mod writes this file beside Psychonauts.exe on first
; run (a copy ships as psyvr.sample.ini). Change a value and restart the game;
; anything you leave out keeps its default.
;
; Settings marked "live" apply without restarting: save the file, then create an
; empty file named reload.flag in the game folder.

[proxy]
; auto = d3d9_dxvk.dll beside the game if present, else the system d3d9.
; dxvk, system, or a full path to any d3d9.dll also work.
backend = auto
logging = 1

[window]
; The game only offers exclusive fullscreen, which fights alt-tab and the VR
; compositor, so a window is forced.
force_windowed = 1
; Client size when VR is off (0 = two thirds of the monitor, at most 1080p).
width = 0
height = 0
borderless = 0
; The game pauses itself when its window is not in front (and ignores input).
; 0 = never (the VR runtime's window or the headset has focus); 1 = as the game.
; Restart to apply.
pause_when_unfocused = 0
; live: free the cursor when the game is not in front.
release_cursor_unfocused = 1

[graphics]
; Highest MSAA sample count offered to the game (it asks for 4). In a headset
; the frame is very large (5376x2304 on a Quest 3) and every one of the game's
; full-screen passes is paid per sample: 2 is the default, 4 is sharper and
; slower, 0 turns multisampling off. Restart to apply.
msaa = 2
; Frame-rate cap inside DXVK. 0 = unlocked, N = N fps. (DXVK's own built-in
; profile may cap the rate; this overrides it.)
max_frame_rate = 0
; Things fading in or out (far away props, mostly) are drawn only where they
; are. The game lays each one over the whole frame twice, which at headset
; resolution can cost more than the rest of the frame. The picture is the
; same; 0 = the game's own way, for comparison. Live.
fast_fades = 1
; Texture packs (Shibanauts HD and the like) replace the game's textures with
; larger ones. The mod recognises a few of the game's effects by the size of
; their texture (the ground pound's orange flash); with this on it also
; accepts the larger versions. 0 = the game's own sizes only, if something
; looks wrong with a texture pack. Live.
texture_pack_compat = 1
; Present interval: -1 = whatever the game's own vsync setting asks for,
; 0 = off, 1 = on.
vsync = -1
; Video memory reported to the game, in MB (0 = DXVK's own 4096). The game sizes
; its texture cache from it, and that cache costs the 32-bit game address space.
; 256 .. 4096.
video_memory_mb = 0

[vr]
; 0 = a plain windowed-mode proxy, no VR.
enabled = 1
; A specific OpenXR runtime manifest for this game only (sets XR_RUNTIME_JSON
; for the process). Empty = the registered 32-bit runtime.
xr_runtime_json =
; live: the game's loading screens (sky, birds and "Loading") in the headset,
; on the theatre's floating screen. They are drawn by another thread of the
; game. 1 = shown, 0 = the headset keeps the last frame until the level is
; loaded, 2 = auto: shown, except in the OpenXR Simulator (it would hang).
loading_screens = 2
; Each eye's render size as a fraction of what the runtime asks for (Virtual
; Desktop can ask for 3072x2612 an eye on a Quest 3). Lower = faster and less
; GPU memory; the headset scales the image up. 0.1 .. 3.0.
resolution_scale = 1
; live: horizon lock. The view keeps the game camera's position and turn but
; not its tilt up/down or roll: look down with your head instead.
; auto = locked except in horizon_lock_off_levels, on = locked everywhere,
; off = the game's camera as it is (it pitches and swoops).
horizon_lock = auto
; live: levels where horizon lock "auto" is off (the game's own camera), by
; name or the start of one, separated by spaces: STMU = the start menu, MM =
; the Milkman Conspiracy (MMI1, MMI2, MMDM). Empty = locked everywhere.
horizon_lock_off_levels = STMU MM
; live: game units per metre. Raz is 125 units tall, so 100 = life size (he
; looks about 1.25 m tall); smaller = the world looks bigger.
world_scale = 100
; vertical field of view the game culls with, in degrees (its own is about 52;
; set at each level start through the PsyVR mod, restart to apply). Wider keeps
; things above and below the game camera drawn once horizon lock and the head
; look there. Our stereo redraws with the headset's own view either way.
; 0 = leave it alone, otherwise 10 .. 179.
cull_fov_degrees = 99
; live: the game's detail culling: small things far away (past 80 m: tree
; tops, rocks, props) fade out once they look smaller on screen than a few
; pixels. 0 = off, so everything is drawn at any distance (the game is light;
; the wide cull field of view above would otherwise make things look smaller
; to it than they are and cut them in the middle of the view). 1 = the game's
; own.
detail_culling = 0
; live: keyboard key that recentres the view while the game is in front:
; F1..F24, A..Z, 0..9 or none. Both stick clicks always recentre.
recenter_key = F8

[camera]
; live: the chase camera's distance from Raz, times this. Below 1 = closer (a
; diorama-like view); the game's own is about 735 units (7 m). 0.1 .. 3.
; Zoom while playing: hold D-pad up (closer) / down (farther) on the pad, or
; the VR D-pad ([controls] dpad_modifier, then slide the left stick up / down),
; or click the right stick in and push it right (closer) / left (farther);
; the value is saved when you let go. Clicked in and pushed up / down, the
; right stick raises / lowers the view instead (up to 2 m up, 1 m down, under
; horizon lock; for this session, back to 0 at a recentre).
chase_radius_scale = 0.756
; live: 1 = the D-pad / VR stick zoom above (in play only, not in menus);
; 0 = off.
zoom_input = 1
; live: in the start menu, metres nearer its 3D scene (Raz, the brain).
; 0 .. 5, 0 = where the game's camera is. Also adjusted in the start menu with
; the right stick (pad or VR): up = nearer, down = farther; saved when let go.
start_menu_zoom = 0
; live: in the start menu, the nearest (in metres) the floating 3D layers
; (doodles, credit bubbles) come: one that would be nearer is pushed back to
; this. Stops the zoom above moving you into them. 0 .. 10, 0 = off.
start_menu_near_limit = 2
; Camera shake and the culling field of view are held by the mod every frame.
; With Astralathe installed (optional) they are also set at each level start
; through its Lua (ModResource\PsyVR).
; The game's camera shakes (landings, explosions). 0 = off: shaking the whole
; world in a headset is uncomfortable.
camera_shake = 0
; live: 1 = the first-person look (the view switch, [controls]) stays on while
; Raz walks and acts; the game's own leaves it
; as soon as he moves. 0 = the game's own.
first_person_stays = 1

[god]
; live: god mode. The world is shown small, Raz a few centimetres tall, and you
; look down on him from a seat above and behind, on a leash. Cutscenes and
; scripted cameras play at normal size. Holding the right stick click switches
; views: classic, god, first person ([controls] god_toggle_hold). While it is
; on the right stick
; turns the view round Raz (x) and zooms (y); clicked in and pushed, it makes
; Raz bigger / smaller (x) and raises / lowers the seat (y). Those changes last
; for the session; a recentre (both stick clicks) puts them back. "Table
; metres" below are metres at the shown (small) scale. 0 = off.
enabled = 0
; live: how tall Raz looks, in centimetres (1 .. 125).
raz_height_cm = 15
; live: table metres back from the centre (0.05 .. 5).
distance = 0.6
; live: table metres up (-1 .. 5).
height = 0.35
; live: table metres Raz walks from the centre before the seat follows him
; (0 .. 3). 0 = always on him.
leash = 0.35
; live: the same, up and down (0 .. 2).
leash_height = 0.1
; live: degrees per second at full right stick, turning the view round Raz
; (0 .. 360).
turn_speed = 90
; live: 1 = the game's own chase camera is moved onto the seat's line, so the
; game culls from there; 0 = leave it where it is.
steer_camera = 1
; live: 1 = that camera also looks where your head looks (and moves with it), so
; the game culls for your view, not for the line to Raz. 0 = it looks at Raz.
aim_with_head = 1

[theatre]
; live: theatre mode. The game as in the flat game (its own camera and
; framing), on a screen floating in a dark room, still in 3D. The screen, its
; picture and the HUD on it stay where they are when you move your head. It
; appears in front of you when it opens; recentre to bring it back.
; 0 = off, the game all around you.
; 1 = cutscenes (and other scripted camera shots) play on the screen.
; 2 = always, gameplay too: horizon lock and god mode then show the game's own
; camera, as classic.
mode = 1
; live: 0 = a 3D screen: the game's shot in stereo, fixed; moving your head does
; not change the picture. 1 = a window into the game: the same shot seen from
; where your head was when it appeared, and leaning or turning looks into the
; scene and round the window's edges (the world is fitted so the window shows
; the game's whole shot from there; depth is only roughly life size).
style = 0
; live: metres from your head to the screen (0.3 .. 50).
distance = 1.93
; live: how wide the screen looks from there, in degrees (10 .. 150).
width_degrees = 57
; live: the screen's width:height shape (0.5 .. 4.0): 1.78 = 16:9, which fits
; the game's 3D view; 1.333 = 4:3, the shape of the game's loading screens and
; other backdrops (on 16:9 they leave bars); 1.5 = 3:2.
aspect = 1.333
; live: how strong the 3D is: the eyes' separation in the game times this.
; 1 = life size, 0 = flat on the screen, above 1 near things get deeper while
; far things stay far (0 .. 3).
depth = 1

[hud]
; live: the game's 2D (HUD, menus) on a screen floating in front of you.
; 0 = drawn into each eye as the game laid it out.
enabled = 1
; live: the in-game HUD (gameplay): metres to the screen (0.1 .. 100), and how
; wide its visible part looks in degrees (2 .. 179). Menus and loading screens
; use the menu_* keys below.
distance = 2.13
width_degrees = 71
; live: the HUD screen shows only the middle of the game's screen at this
; width:height shape. Psychonauts lays its 2D out at 4:3 (640x480) centred in
; the wider screen; the sides are empty. 1.0 .. 4.0, 0 = the whole screen.
aspect = 1.65
; live: the screen that shows menus and loading screens (2D with no 3D scene
; behind it): metres to it (0.1 .. 100), and how wide it looks in degrees
; (2 .. 179; the visible part, after the crop below).
menu_distance = 4.64
menu_width_degrees = 67
; live: the menu screen likewise (1.0 .. 4.0; 1.333 = the game's 4:3 layout).
; 0 = show the game's whole screen.
menu_aspect = 1.97
; live: 1 = menus and loading screens stay where they were placed in the
; room: in front of you whenever one appears, and at a recentre.
; 0 = menus and loading screens move with your head.
world_locked = 1
; live: 1 = the in-game HUD does not turn with your head: it stays straight
; ahead (the way you faced at the last recentre) and moves only with your
; head's position. 0 = fixed to your head, so the aiming reticle always
; marks where you look.
body_locked = 1
; live: 1 = while you are locked on (left trigger), the game's lock-on reticle
; sits on the target in 3D, in both eyes, instead of on the HUD screen.
; 0 = the game's reticle stays on the HUD screen.
lock_reticle = 1
; live: how high above the target's feet the 3D reticle sits, in metres
; (-2 .. 5).
lock_reticle_height = 0.6
; live: the 3D reticle's size, against how big it would look on the HUD
; screen (0.1 .. 10).
lock_reticle_scale = 2
; live: the game's fades to black (between areas, at loads):
; 0 = on the HUD screen, as a floating black panel;
; 1 = over the whole view, in both eyes; 2 = left out.
screen_fades = 1
; live: the game's full-screen colour flashes (the ground pound's orange):
; 0 = on the HUD screen; 1 = over the whole view; 2 = left out.
screen_flashes = 2

[overlay]
; The settings overlay (Insert on the keyboard) is also shown in the headset,
; as a flat panel placed in the room in front of you when it opens (and at a
; recentre). The controllers drive it while it is open: left stick or D-pad
; moves, A selects, B goes back, left/right changes a slider, the right stick
; scrolls, the menu button closes it; the game gets no pad input meanwhile.
; Holding the pause button (Start / the controller menu button) for
; vr_open_hold seconds opens it; a quicker press still pauses the game.
; live: metres to the panel (0.3 .. 5), and how wide it looks in degrees
; (10 .. 120).
vr_distance = 1
vr_width_degrees = 38
; live: where the panel sits round your head: degrees to the left of straight
; ahead (-90 .. 90, negative = right) and degrees up (-60 .. 60, negative =
; down). It always faces you.
vr_yaw_degrees = 15
vr_pitch_degrees = -10
; live: seconds to hold the pause button to open (or close) the panel
; (0 .. 3). 0 = off: the button always goes straight to the game.
vr_open_hold = 0.6

[controls]
; The VR controllers as the game's pad 0 (a real pad still works). The game
; picks keyboard or pad at start-up, so with this on pad 0 always reads as
; connected and the game starts in pad mode. Restart the game after changing it.
enabled = 1
; live: which control presses each pad button. Sources: right_a right_b
; left_x left_y left_menu right_menu left_stick right_stick left_grip
; right_grip left_trigger right_trigger none
a = right_a
b = right_b
x = left_x
y = left_y
start = left_menu
; Touch controllers have no right menu button; give Back another source there.
back = right_menu
lb = left_grip
rb = right_grip
l3 = left_stick
r3 = right_stick
; live: the D-pad (left = the item wheel; up / down = camera zoom): click
; this control (tap or hold), then slide the left stick toward the direction
; you want; Raz does not move until the stick is back in the centre. Held,
; every slide is another press; a tap waits 1.5 s for its slide. While it is
; armed the start button presses Back. The default, left_stick, is the left
; stick click; that click no longer sends L3. none = off.
dpad_modifier = left_stick
; Vibration strength; 0 = off. 0 .. 10.
rumble = 1
; live: the right stick click (the r3 control), as in the Underworld mod: held
; this many seconds it switches the view (with a buzz): classic -> god mode ->
; first person -> classic; a quicker tap resets the view: the camera glides
; behind Raz at its own height (the zoom and Raz's size stay; from first person
; it goes back to classic); clicked in and pushed, it moves the view (see
; [camera] chase_radius_scale and [god] enabled) and the stick does not reach
; the game. Both stick clicks recentre. 0 .. 3, 0 = no view switching.
god_toggle_hold = 0.4
; live: 1 = the first-person look is one of the views the hold switches
; through; 0 = it switches between classic and god mode only.
first_person_in_cycle = 1
; live: seconds the view glides from one to the next (position, direction
; and size together). 0 = a cut. 0 .. 10.
view_transition_seconds = 0.3

[debug]
; live: a fixed extra head yaw in degrees, for testing with a runtime whose
; head never moves.
head_yaw_test = 0
; live: on top of it, a yaw swinging this many degrees each way once a second (a
; moving head for the same runtime). 0 = off.
head_wobble = 0
; live: a sideways sway of the head's position, in cm, along your head's right side,
; going back and forth once every two seconds (a leaning head for the same runtime).
; 0 = off. 0 .. 50.
head_sway_test = 0
; End the game when a frame has been stuck this many seconds (the log says
; where). For unattended tests. 0 = never. 0 .. 600.
hang_exit_seconds = 0
; live: reload psyvr_logic.dll while the game runs when it is rebuilt (checked
; every 30 frames); for development. 0 = loaded once.
hot_reload = 0
; start-up only: a named pipe (\.\pipe\psyvr) takes test commands (ping,
; status, shot, drawlog, set, ...; tools\drive.ps1 Psy-Cmd) while the game runs. For
; development. 0 = off.
control_pipe = 0
